[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/relay",
    "crates/client-core",
    "crates/cli",
    "crates/e2e-tests",
    "crates/mobile-core",
    "crates/updater",
    "crates/gui",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://example.invalid/drive-sync"

[workspace.dependencies]
drive-core = { path = "crates/core" }
drive-relay = { path = "crates/relay" }
drive-client = { path = "crates/client-core" }
drive-updater = { path = "crates/updater" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
blake3 = "1.8"
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
axum = { version = "0.7", features = ["ws", "tokio"] }
arboard = "3.4"

[profile.release]
lto = "thin"
codegen-units = 1
