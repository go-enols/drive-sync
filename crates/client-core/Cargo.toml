[package]
name = "drive-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "drive-sync 客户端同步引擎：会话路由、剪切板去重、目录同步、文件中转"

[features]
default = []
# 可选 TLS 支持：启用后可连接 wss:// 中继（默认关闭以缩短原型编译时间；
# 未启用时连接 wss:// 会在握手阶段返回明确错误）。
tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "dep:rustls"]

[dependencies]
drive-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
zstd = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
# rustls 0.23 必须显式启用且安装一个 crypto provider；移动端没有 reqwest 的
# 特性合并，默认不会带上 ring，导致首次 wss 连接 panic。这里固定用 ring。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
futures-util = { workspace = true }
x25519-dalek = { workspace = true }

[dev-dependencies]
tempfile = "3"
