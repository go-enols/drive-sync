[package]
name = "drive-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "drive-sync 桌面图形客户端（eframe/egui）：首次运行向导、配对、剪切板、目录、暂存与设置"

[[bin]]
name = "drive-sync-gui"
path = "src/main.rs"

[dependencies]
drive-core = { workspace = true }
drive-client = { workspace = true, features = ["tls"] }
drive-updater = { workspace = true }
eframe = "0.31"
egui = "0.31"
arboard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

# 系统托盘：仅 Windows / macOS 启用（Linux 发行版依赖 libappindicator，风险较大，回退任务栏）。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
